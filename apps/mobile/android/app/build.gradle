apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// Hoisted pnpm layout: react-native lives at workspace root, not apps/mobile
def rnCandidates = [
    file("../../node_modules/react-native"),
    file("../../../node_modules/react-native"),
    file("../../../../node_modules/react-native"),
]
def rnPackageDir = rnCandidates.find { it.exists() } ?: rnCandidates[0]
def nmParent = rnPackageDir.exists() ? rnPackageDir.canonicalFile.parentFile : file("../../node_modules")
def codegenCandidates = [
    new File(nmParent, "@react-native/codegen"),
    file("../../node_modules/@react-native/codegen"),
    file("../../../node_modules/@react-native/codegen"),
    file("../../../../node_modules/@react-native/codegen"),
]
def codegenDir = codegenCandidates.find { it.exists() } ?: codegenCandidates[0]

react {
    // package.json lives at apps/mobile (two levels up from android/app)
    root = file("../..")
    reactNativeDir = rnPackageDir
    codegenDir = codegenDir
    cliFile = new File(rnPackageDir, "cli.js")
    hermesFlags = ["-O"]
    // Hoisted pnpm layout: resolve hermesc from the real react-native package
    hermesCommand = new File(rnPackageDir, "sdks/hermesc/%OS-BIN%/hermesc").absolutePath
    // Bundle JS into every APK so installs work without Metro
    debuggableVariants = []
}

def enableProguardInReleaseBuilds = true
def jscFlavor = 'org.webkit:android-jsc:+'

def DEFAULT_VERSION_CODE = 2
def DEFAULT_VERSION_NAME = "1.0.1"

android {
    namespace "com.hx.turna"
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.hx.turna"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode DEFAULT_VERSION_CODE
        versionName DEFAULT_VERSION_NAME
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // CI: keystore decoded from GitHub secret ANDROID_KEYSTORE_BASE64 into
            // apps/mobile/android/keystore/turna-release.keystore (gitignored).
            // Local: same path if you place the keystore there manually.
            def envPath = System.getenv("SIGNING_STORE_FILE") ?: (project.hasProperty('SIGNING_STORE_FILE') ? SIGNING_STORE_FILE : null)
            def candidates = []
            if (envPath) {
                candidates << file(envPath)
                candidates << new File(rootProject.projectDir, envPath)
                def ws = System.getenv("GITHUB_WORKSPACE")
                if (ws) candidates << new File(ws, envPath)
            }
            candidates << file("${rootProject.projectDir}/keystore/turna-release.keystore")
            def ksFile = candidates.find { it != null && it.exists() }
            if (ksFile == null) {
                throw new GradleException(
                    "Release keystore missing (tried: ${candidates.collect { it.absolutePath }}). " +
                    "CI must set ANDROID_KEYSTORE_BASE64; locally place turna-release.keystore under android/keystore/."
                )
            }
            storeFile ksFile
            storePassword System.getenv("SIGNING_STORE_PASSWORD") ?: (project.hasProperty('SIGNING_STORE_PASSWORD') ? SIGNING_STORE_PASSWORD : 'Turna2026')
            keyAlias System.getenv("SIGNING_KEY_ALIAS") ?: (project.hasProperty('SIGNING_KEY_ALIAS') ? SIGNING_KEY_ALIAS : 'turna')
            keyPassword System.getenv("SIGNING_KEY_PASSWORD") ?: (project.hasProperty('SIGNING_KEY_PASSWORD') ? SIGNING_KEY_PASSWORD : 'Turna2026')
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Always release-signed — never fall back to debug (Play Protect flags debug certs)
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    packagingOptions {
        pickFirst "**/*.so"
        pickFirst "META-INF/MANIFEST.MF"
        pickFirst "**/coroutines.pro"
        pickFirst "META-INF/com.android.tools/proguard/coroutines.pro"
        pickFirst "META-INF/versions/9/OSGI-INF/MANIFEST.MF"
        pickFirst "META-INF/*.kotlin_module"
        excludes = [
            "**/lib/x86/**",
            "**/lib/x86_64/**",
            "**/lib/armeabi/**",
            "**/META-INF/{AL2.0,LGPL2.1}",
            "**/META-INF/*.version",
            "**/module-info.class",
            "**/*.kotlin_builtins"
        ]
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    implementation("androidx.appcompat:appcompat:1.6.1")
}

def cliAndroidGradle = [
    new File(rootDir, "../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"),
    new File(rootDir, "../../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"),
    new File(rootDir, "../../../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"),
].find { it.exists() }

if (cliAndroidGradle == null && rnPackageDir.exists()) {
    def sibling = new File(rnPackageDir.canonicalFile.parentFile, "@react-native-community/cli-platform-android/native_modules.gradle")
    if (sibling.exists()) {
        cliAndroidGradle = sibling
    }
}

if (cliAndroidGradle == null) {
    throw new GradleException(
        "Cannot find @react-native-community/cli-platform-android/native_modules.gradle"
    )
}

apply from: cliAndroidGradle
applyNativeModulesAppBuildGradle(project)
