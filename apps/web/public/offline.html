<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Turna</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, system-ui, sans-serif;
        background: #f7f7f0;
        color: #03251b;
        padding: 24px;
      }
      .card {
        max-width: 360px;
        text-align: center;
        background: #fff;
        border: 1px solid #dde5e0;
        border-radius: 18px;
        padding: 28px 24px;
      }
      h1 {
        font-size: 1.15rem;
        margin: 0 0 8px;
      }
      p {
        margin: 0;
        color: #60736c;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      button {
        margin-top: 18px;
        border: 0;
        border-radius: 12px;
        background: #00a878;
        color: #fff;
        font-weight: 600;
        padding: 10px 18px;
        cursor: pointer;
      }
      button:hover {
        background: #00966c;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You&apos;re offline</h1>
      <p>
        Showing your last synced data if available. Reconnect to load fresh
        information and continue savings actions.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      }
    </script>
  </body>
</html>
