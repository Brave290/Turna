project_id = "your-project-id"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
port = 54327
file_size_limit = "50MiB"
upload_backend = "file"

[auth]
enabled = true
port = 54328
jwt_expiry = 3600
enable_signup = true
enable_email_signup = true
enable_phone_signup = false
enable_phone_change = false
enable_email_change = true
enable_email_autoconfirm = false
enable_phone_autoconfirm = false
provider = "email"
external_email_enabled = true
external_phone_enabled = false

[auth.external]
email_enabled = true
google_enabled = true
google_client_id = "your-google-client-id"
google_secret = "your-google-client-secret"

[realtime]
enabled = true
ip_version = "ipv4"
port = 54329

[edge_runtime]
enabled = true
port = 54330