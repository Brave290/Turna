name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  APP_NAME: turna

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "release_name=Turna $VERSION" >> $GITHUB_OUTPUT

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      # Decode release keystore from GitHub secret — never commit the binary
      - name: Restore Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          mkdir -p apps/mobile/android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/mobile/android/keystore/turna-release.keystore
          MAGIC=$(head -c 2 apps/mobile/android/keystore/turna-release.keystore | od -An -tx1 | tr -d ' \n')
          case "$MAGIC" in
            feedfefe|3082) ;;
            *)
              echo "Decoded keystore has unexpected magic: $MAGIC" >&2
              exit 1
              ;;
          esac
          SIZE=$(stat -c%s apps/mobile/android/keystore/turna-release.keystore)
          if [ "$SIZE" -lt 100 ]; then
            echo "Decoded keystore too small ($SIZE bytes)" >&2
            exit 1
          fi
          echo "Keystore restored ($SIZE bytes, magic $MAGIC)"

      - name: Build Android Release AAB
        run: ./gradlew bundleRelease
        working-directory: apps/mobile/android
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ secrets.ANDROID_SIGNING_STORE_FILE }}

      - name: Build Android Release APK
        run: ./gradlew assembleRelease
        working-directory: apps/mobile/android
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ secrets.ANDROID_SIGNING_STORE_FILE }}

      - name: Prepare release artifacts
        run: |
          VERSION=${{ steps.version.outputs.version }}
          APP_NAME=${{ env.APP_NAME }}
          
          mkdir -p release-artifacts
          
          cp apps/mobile/android/app/build/outputs/bundle/release/app-release.aab \
            release-artifacts/${APP_NAME}-${VERSION}.aab
          
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            release-artifacts/${APP_NAME}-${VERSION}.apk
          
          git archive --format=tar.gz --prefix=${APP_NAME}-${VERSION}/ \
            -o release-artifacts/${APP_NAME}-${VERSION}-source.tar.gz \
            HEAD
          
          cd release-artifacts
          sha256sum ${APP_NAME}-${VERSION}.aab > ${APP_NAME}-${VERSION}.aab.sha256
          sha256sum ${APP_NAME}-${VERSION}.apk > ${APP_NAME}-${VERSION}.apk.sha256
          sha256sum ${APP_NAME}-${VERSION}-source.tar.gz > ${APP_NAME}-${VERSION}-source.tar.gz.sha256
          # Full release bundle: APK + AAB + source + all checksums
          zip -9 ${APP_NAME}-${VERSION}-bundle.zip \
            ${APP_NAME}-${VERSION}.aab \
            ${APP_NAME}-${VERSION}.apk \
            ${APP_NAME}-${VERSION}-source.tar.gz \
            ${APP_NAME}-${VERSION}.aab.sha256 \
            ${APP_NAME}-${VERSION}.apk.sha256 \
            ${APP_NAME}-${VERSION}-source.tar.gz.sha256
          sha256sum ${APP_NAME}-${VERSION}-bundle.zip > ${APP_NAME}-${VERSION}-bundle.zip.sha256
          cd ..

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%an)" --reverse)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%an)" --reverse $PREV_TAG..HEAD)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.release_name }}
          body: |
            ## Turna ${{ steps.version.outputs.version }}
            
            ### Changes
            ${{ steps.changelog.outputs.changelog }}
            
            ### Downloads
            - **Android App Bundle (for Play Store)**: `turna-${{ steps.version.outputs.version }}.aab`
            - **Android APK (for direct install)**: `turna-${{ steps.version.outputs.version }}.apk`
            - **Full release bundle (APK + AAB + source + checksums)**: `turna-${{ steps.version.outputs.version }}-bundle.zip`
            - **Source Code**: `turna-${{ steps.version.outputs.version }}-source.tar.gz`
            
            ### Verification
            All artifacts include SHA256 checksums (`.sha256` files).
            
            ### Built by
            Akanji Mus'ab • Brave hx Technology • Founda Technologies
          files: |
            release-artifacts/turna-${{ steps.version.outputs.version }}.aab
            release-artifacts/turna-${{ steps.version.outputs.version }}.apk
            release-artifacts/turna-${{ steps.version.outputs.version }}-source.tar.gz
            release-artifacts/turna-${{ steps.version.outputs.version }}-bundle.zip
            release-artifacts/turna-${{ steps.version.outputs.version }}-bundle.zip.sha256
            release-artifacts/turna-${{ steps.version.outputs.version }}.aab.sha256
            release-artifacts/turna-${{ steps.version.outputs.version }}.apk.sha256
            release-artifacts/turna-${{ steps.version.outputs.version }}-source.tar.gz.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Mirror APK + full bundle to the public downloads-only repo (no source-only extract).
      # Requires secret DOWNLOADS_REPO_TOKEN (fine-grained PAT: contents:write on Brave290/Turna-Downloads)
      # and DOWNLOADS_REPO (e.g. Brave290/Turna-Downloads).
      # Stable URLs:
      #   https://github.com/Brave290/Turna-Downloads/releases/latest/download/turna.apk
      #   https://github.com/Brave290/Turna-Downloads/releases/latest/download/turna-bundle.zip
      - name: Check downloads token
        id: check-downloads
        env:
          DOWNLOADS_REPO_TOKEN: ${{ secrets.DOWNLOADS_REPO_TOKEN }}
        run: |
          if [ -n "$DOWNLOADS_REPO_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish APK + bundle to public downloads repo
        if: steps.check-downloads.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_REPO_TOKEN }}
          DOWNLOADS_REPO: ${{ vars.DOWNLOADS_REPO || 'Brave290/Turna-Downloads' }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          APK_PATH: release-artifacts/turna-${{ steps.version.outputs.version }}.apk
          AAB_PATH: release-artifacts/turna-${{ steps.version.outputs.version }}.aab
          BUNDLE_PATH: release-artifacts/turna-${{ steps.version.outputs.version }}-bundle.zip
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$DOWNLOADS_REPO" >/dev/null 2>&1 || {
            gh release create "$TAG" \
              --repo "$DOWNLOADS_REPO" \
              --title "Turna $VERSION" \
              --notes "Turna $VERSION — APK, full release bundle (APK + AAB + source + checksums)." \
              --latest
          }
          cp "$APK_PATH" turna.apk
          cp "$AAB_PATH" turna.aab
          cp "$BUNDLE_PATH" turna-bundle.zip
          gh release upload "$TAG" \
            --repo "$DOWNLOADS_REPO" \
            turna.apk \
            turna.aab \
            turna-bundle.zip \
            "release-artifacts/turna-${VERSION}.apk" \
            "release-artifacts/turna-${VERSION}.apk.sha256" \
            "release-artifacts/turna-${VERSION}.aab" \
            "release-artifacts/turna-${VERSION}.bundle.zip.sha256" \
            --clobber
          gh release edit "$TAG" --repo "$DOWNLOADS_REPO" --latest

      - name: Check Vercel token
        id: check-vercel
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        if: steps.check-vercel.outputs.available == 'true'
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}