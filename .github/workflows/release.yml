name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  APP_NAME: turna

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          CODE=$(( $(date -u +%s) / 60 ))
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "release_name=Turna Android v$VERSION" >> $GITHUB_OUTPUT

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      # Decode release keystore from GitHub secret — never commit the binary
      - name: Restore Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          mkdir -p apps/mobile/android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/mobile/android/keystore/turna-release.keystore
          MAGIC=$(head -c 2 apps/mobile/android/keystore/turna-release.keystore | od -An -tx1 | tr -d ' \n')
          case "$MAGIC" in
            feedfefe|3082) ;;
            *)
              echo "Decoded keystore has unexpected magic: $MAGIC" >&2
              exit 1
              ;;
          esac
          SIZE=$(stat -c%s apps/mobile/android/keystore/turna-release.keystore)
          if [ "$SIZE" -lt 100 ]; then
            echo "Decoded keystore too small ($SIZE bytes)" >&2
            exit 1
          fi
          echo "Keystore restored ($SIZE bytes, magic $MAGIC)"

      - name: Build Android Release AAB
        run: ./gradlew bundleRelease
        working-directory: apps/mobile/android
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ secrets.ANDROID_SIGNING_STORE_FILE }}

      - name: Build Android Release APK
        run: ./gradlew assembleRelease
        working-directory: apps/mobile/android
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ secrets.ANDROID_SIGNING_STORE_FILE }}

      - name: Prepare release artifacts
        run: |
          VERSION=${{ steps.version.outputs.version }}
          CODE=${{ steps.version.outputs.code }}
          APP_NAME=${{ env.APP_NAME }}
          
          mkdir -p release-artifacts
          
          cp apps/mobile/android/app/build/outputs/bundle/release/app-release.aab \
            release-artifacts/${VERSION}-${APP_NAME}.aab
          
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            release-artifacts/${VERSION}-${APP_NAME}.apk
          
          git archive --format=tar.gz --prefix=${VERSION}-${APP_NAME}/ \
            -o release-artifacts/${VERSION}-${APP_NAME}-source.tar.gz \
            HEAD
          
          printf '{"versionCode": %s, "versionName": "%s", "minSupportedCode": 1, "apk": "%s-%s.apk", "aab": "%s-%s.aab", "notes": "Turna build %s", "builtAt": "%s"}' \
            "$CODE" "$VERSION" "$VERSION" "$APP_NAME" "$VERSION" "$APP_NAME" "${GITHUB_SHA::7}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > release-artifacts/version.json
          
          cd release-artifacts
          sha256sum ${VERSION}-${APP_NAME}.aab > ${VERSION}-${APP_NAME}.aab.sha256
          sha256sum ${VERSION}-${APP_NAME}.apk > ${VERSION}-${APP_NAME}.apk.sha256
          sha256sum ${VERSION}-${APP_NAME}-source.tar.gz > ${VERSION}-${APP_NAME}-source.tar.gz.sha256
          # Full release bundle: APK + AAB + source + all checksums
          zip -9 ${VERSION}-${APP_NAME}-bundle.zip \
            ${VERSION}-${APP_NAME}.aab \
            ${VERSION}-${APP_NAME}.apk \
            ${VERSION}-${APP_NAME}-source.tar.gz \
            ${VERSION}-${APP_NAME}.aab.sha256 \
            ${VERSION}-${APP_NAME}.apk.sha256 \
            ${VERSION}-${APP_NAME}-source.tar.gz.sha256
          sha256sum ${VERSION}-${APP_NAME}-bundle.zip > ${VERSION}-${APP_NAME}-bundle.zip.sha256
          cd ..

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%an)" --reverse)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%an)" --reverse $PREV_TAG..HEAD)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.release_name }}
          body: |
            ## Turna ${{ steps.version.outputs.version }}
            
            ### Changes
            ${{ steps.changelog.outputs.changelog }}
            
            ### Downloads
            - **Android APK (direct install)**: `${{ steps.version.outputs.version }}-turna.apk`
            - **Android App Bundle (Play Store)**: `${{ steps.version.outputs.version }}-turna.aab`
            - **Full release bundle (APK + AAB + source + checksums)**: `${{ steps.version.outputs.version }}-turna-bundle.zip`
            - **Source Code**: `${{ steps.version.outputs.version }}-turna-source.tar.gz`
            
            ### Verification
            All artifacts include SHA256 checksums (`.sha256` files).
            
            ### Built by
            Akanji Mus'ab • Brave hx Technology • Founda Technologies
          files: |
            release-artifacts/${{ steps.version.outputs.version }}-turna.aab
            release-artifacts/${{ steps.version.outputs.version }}-turna.apk
            release-artifacts/${{ steps.version.outputs.version }}-turna-source.tar.gz
            release-artifacts/${{ steps.version.outputs.version }}-turna-bundle.zip
            release-artifacts/${{ steps.version.outputs.version }}-turna-bundle.zip.sha256
            release-artifacts/${{ steps.version.outputs.version }}-turna.aab.sha256
            release-artifacts/${{ steps.version.outputs.version }}-turna.apk.sha256
            release-artifacts/${{ steps.version.outputs.version }}-turna-source.tar.gz.sha256
            release-artifacts/version.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Mirror versioned artifacts to the public downloads-only repo.
      # Requires secret DOWNLOADS_REPO_TOKEN (contents:write on Brave290/Turna-Downloads).
      # Assets: {VERSION}-turna.apk / {VERSION}-turna.aab / version.json (+ bundle).
      - name: Check downloads token
        id: check-downloads
        env:
          DOWNLOADS_REPO_TOKEN: ${{ secrets.DOWNLOADS_REPO_TOKEN }}
        run: |
          if [ -n "$DOWNLOADS_REPO_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish versioned release to public downloads repo
        if: steps.check-downloads.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_REPO_TOKEN }}
          DOWNLOADS_REPO: ${{ vars.DOWNLOADS_REPO || 'Brave290/Turna-Downloads' }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          APK_PATH: release-artifacts/${{ steps.version.outputs.version }}-turna.apk
          AAB_PATH: release-artifacts/${{ steps.version.outputs.version }}-turna.aab
          BUNDLE_PATH: release-artifacts/${{ steps.version.outputs.version }}-turna-bundle.zip
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$DOWNLOADS_REPO" >/dev/null 2>&1 || {
            gh release create "$TAG" \
              --repo "$DOWNLOADS_REPO" \
              --latest \
              --title "Turna Android v${VERSION}" \
              --notes "Turna Android v${VERSION} — ${VERSION}-turna.apk, ${VERSION}-turna.aab, full bundle + checksums."
          }
          gh release upload "$TAG" \
            --repo "$DOWNLOADS_REPO" \
            "$APK_PATH" \
            "$AAB_PATH" \
            "$BUNDLE_PATH" \
            "release-artifacts/${VERSION}-turna.apk.sha256" \
            "release-artifacts/${VERSION}-turna.aab.sha256" \
            "release-artifacts/${VERSION}-turna-bundle.zip.sha256" \
            "release-artifacts/version.json" \
            --clobber
          gh release edit "$TAG" --repo "$DOWNLOADS_REPO" --latest --title "Turna Android v${VERSION}"

      - name: Check Vercel token
        id: check-vercel
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        if: steps.check-vercel.outputs.available == 'true'
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}