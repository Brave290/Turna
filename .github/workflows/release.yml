name: Release

# Every push to main builds the Android app and publishes a NEW release
# v1.0.N+1 (N = highest existing release/tag, fallback 1). Tags stay as an
# extra manual trigger.
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

# Only the newest push builds — superseded runs are cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  APP_NAME: turna

jobs:
  # iOS builds in parallel so one push produces BOTH platforms in one release.
  ios:
    name: iOS Build
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: CocoaPods install
        working-directory: apps/mobile/ios
        run: pod install --repo-update

      - name: Build iOS (simulator, unsigned)
        working-directory: apps/mobile/ios
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace Turna.xcworkspace \
            -scheme Turna \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData \
            -path '*Build/Products/Release-iphonesimulator/Turna.app' \
            -maxdepth 6 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Could not locate built Turna.app" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ios-out"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RUNNER_TEMP/ios-out/turna-ios-simulator.zip"
          echo "Built: $APP_PATH"
          ls -la "$RUNNER_TEMP/ios-out"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: ${{ runner.temp }}/ios-out/turna-ios-simulator.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Build & Release
    needs: ios
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Auto version: short 1.0.N (next patch from releases/tags — "v1.0.1" style),
      # code = epoch minutes (always monotonic for Android upgrades).
      # Manual tag pushes (refs/tags/v*) keep the tag's own version.
      - name: Compute version (auto)
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/*)
              VERSION="${GITHUB_REF_NAME#v}"
              ;;
            *)
              MAX=0
              CANDS=$( { gh api "repos/${GITHUB_REPOSITORY}/releases" --jq '.[].name' 2>/dev/null || true; gh api "repos/${GITHUB_REPOSITORY}/tags" --jq '.[].name' 2>/dev/null || true; } )
              for CAND in $CANDS; do
                CAND="${CAND#Turna Android }"
                if printf '%s' "$CAND" | grep -Eq '^v?1\.0\.([0-9]+)$'; then
                  N=$(printf '%s' "$CAND" | sed -E 's/^v?1\.0\.([0-9]+)$/\1/')
                  if [ "$N" -gt "$MAX" ]; then MAX="$N"; fi
                fi
              done
              VERSION="1.0.$((MAX + 1))"
              ;;
          esac
          CODE=$(( $(date -u +%s) / 60 ))
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_name=${TAG}" >> "$GITHUB_OUTPUT"
          printf '{"versionCode": %s, "versionName": "%s", "minSupportedCode": 1, "apk": "turna.apk", "aab": "turna.aab", "notes": "Turna build %s", "builtAt": "%s"}' \
            "$CODE" "$VERSION" "${GITHUB_SHA::7}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > version.json
          echo "Auto version ${VERSION} (code ${CODE}, next patch after ${MAX})"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      # Decode release keystore from GitHub secret — never commit the binary
      - name: Restore Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          mkdir -p apps/mobile/android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/mobile/android/keystore/turna-release.keystore
          MAGIC=$(head -c 2 apps/mobile/android/keystore/turna-release.keystore | od -An -tx1 | tr -d ' \n')
          case "$MAGIC" in
            feedfefe|3082) ;;
            *)
              echo "Decoded keystore has unexpected magic: $MAGIC" >&2
              exit 1
              ;;
          esac
          SIZE=$(stat -c%s apps/mobile/android/keystore/turna-release.keystore)
          if [ "$SIZE" -lt 100 ]; then
            echo "Decoded keystore too small ($SIZE bytes)" >&2
            exit 1
          fi
          echo "Keystore restored ($SIZE bytes, magic $MAGIC)"

      - name: Stamp build with current commit
        run: |
          set -euo pipefail
          STAMP="${GITHUB_SHA::7}"
          printf '/**\n * Build stamp — overwritten by CI with the current short commit SHA before\n * Gradle runs. `verify-no-stale-bundle` in release.yml greps the JS bundle\n * inside the built APK for this value, so a cached/stale bundle fails the\n * release instead of shipping.\n */\nexport const BUILD_STAMP = %s;\n' "'${STAMP}'" \
            > apps/mobile/src/lib/build-stamp.ts
          grep -n "BUILD_STAMP" apps/mobile/src/lib/build-stamp.ts

      # Force a full rebuild — Gradle otherwise treats the generated JS bundle
      # as up-to-date and can ship a stale bundle inside a fresh versionCode.
      - name: Purge previous build outputs and JS bundle
        run: |
          rm -rf app/build build .gradle/configuration-cache
          rm -f app/src/main/assets/index.android.bundle
        working-directory: apps/mobile/android

      - name: Build Android Release AAB
        run: ./gradlew clean bundleRelease --no-daemon --no-build-cache
        working-directory: apps/mobile/android
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ secrets.ANDROID_SIGNING_STORE_FILE }}

      - name: Build Android Release APK
        run: ./gradlew assembleRelease --no-daemon --no-build-cache
        working-directory: apps/mobile/android
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ secrets.ANDROID_SIGNING_STORE_FILE }}

      - name: Verify no stale bundle in APK
        run: |
          set -euo pipefail
          STAMP="${GITHUB_SHA::7}"
          APK=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "APK not found at $APK" >&2
            exit 1
          fi
          rm -rf /tmp/apkverify && mkdir -p /tmp/apkverify
          unzip -o -q "$APK" assets/index.android.bundle -d /tmp/apkverify
          BUNDLE=/tmp/apkverify/assets/index.android.bundle
          if [ ! -f "$BUNDLE" ]; then
            echo "FAIL: no JS bundle inside the APK" >&2
            exit 1
          fi
          SIZE=$(stat -c%s "$BUNDLE")
          echo "Bundle size: ${SIZE} bytes"
          if [ "$SIZE" -lt 500000 ]; then
            echo "FAIL: bundle suspiciously small (${SIZE} bytes) — likely a stub" >&2
            exit 1
          fi
          if grep -qa "$STAMP" "$BUNDLE"; then
            echo "PASS: bundle contains build stamp ${STAMP} — fresh build confirmed"
          else
            echo "FAIL: bundle does NOT contain build stamp ${STAMP} — STALE BUNDLE" >&2
            exit 1
          fi

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ios-build
          path: release-artifacts

      - name: Prepare release artifacts
        run: |
          set -euo pipefail
          VERSION=${{ steps.version.outputs.version }}
          CODE=${{ steps.version.outputs.code }}

          mkdir -p release-artifacts

          cp apps/mobile/android/app/build/outputs/bundle/release/app-release.aab \
            release-artifacts/turna.aab

          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
            release-artifacts/turna.apk

          git archive --format=tar.gz --prefix=${VERSION}-turna/ \
            -o release-artifacts/turna-source.tar.gz \
            HEAD

          cp version.json release-artifacts/version.json

          cd release-artifacts
          sha256sum turna.aab > turna.aab.sha256
          sha256sum turna.apk > turna.apk.sha256
          sha256sum turna-source.tar.gz > turna-source.tar.gz.sha256
          if [ -f turna-ios-simulator.zip ]; then
            sha256sum turna-ios-simulator.zip > turna-ios-simulator.zip.sha256
          fi
          # Full release bundle: APK + AAB + iOS + source + all checksums
          ZIP_FILES="turna.aab turna.apk turna-source.tar.gz turna.aab.sha256 turna.apk.sha256 turna-source.tar.gz.sha256"
          if [ -f turna-ios-simulator.zip ]; then
            ZIP_FILES="$ZIP_FILES turna-ios-simulator.zip turna-ios-simulator.zip.sha256"
          fi
          zip -9 turna-bundle.zip $ZIP_FILES
          sha256sum turna-bundle.zip > turna-bundle.zip.sha256
          cd ..

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%an)" --reverse)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%an)" --reverse $PREV_TAG..HEAD)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # New release per push: gh release create/upload on tag v1.0.N,
      # assets keep the fixed names turna.apk / turna.aab / version.json.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NAME: ${{ steps.version.outputs.release_name }}
          CODE: ${{ steps.version.outputs.code }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          # Always publish as a Pre-release first; the "Promote prerelease to
          # full release" step at the end flips it to a full Latest release
          # once the artifacts verify. Pin RELEASE_PRERELEASE=true to stop
          # auto-promotion (stays prerelease forever).
          PRERELEASE: 'true'
        run: |
          set -euo pipefail
          BUILT_BY="Akanji Mus'ab • Brave hx Technology • Founda Technologies"
          NOTES=$(printf '## Turna %s\n\n### Changes\n%s\n\n### Downloads\n- **Android APK (direct install)**: `turna.apk`\n- **Android App Bundle (Play Store)**: `turna.aab`\n- **iOS Simulator build (unsigned)**: `turna-ios-simulator.zip`\n- **Full release bundle (APK + AAB + iOS + source + checksums)**: `turna-bundle.zip`\n- **Source Code**: `turna-source.tar.gz`\n\nBuild %s · versionCode %s\n\n### Verification\nAll artifacts include SHA256 checksums (`.sha256` files).\n\n### Built by\n%s' \
            "$VERSION" "$CHANGELOG" "${GITHUB_SHA::7}" "$CODE" "$BUILT_BY")

          if [ "$PRERELEASE" = "true" ]; then
            PRE_ARGS=(--prerelease=true --latest=false)
          else
            PRE_ARGS=(--prerelease=false --latest)
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || {
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_NAME" \
              --notes "$NOTES" \
              "${PRE_ARGS[@]}"
          }
          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            release-artifacts/turna.apk \
            release-artifacts/turna.aab \
            release-artifacts/version.json \
            release-artifacts/turna-source.tar.gz \
            release-artifacts/turna-bundle.zip \
            release-artifacts/turna.aab.sha256 \
            release-artifacts/turna.apk.sha256 \
            release-artifacts/turna-source.tar.gz.sha256 \
            release-artifacts/turna-bundle.zip.sha256 \
            --clobber
          if [ -f release-artifacts/turna-ios-simulator.zip ]; then
            gh release upload "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              release-artifacts/turna-ios-simulator.zip \
              release-artifacts/turna-ios-simulator.zip.sha256 \
              --clobber
          fi
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            "${PRE_ARGS[@]}" \
            --title "$RELEASE_NAME" \
            --notes "$NOTES"
          echo "Published ${TAG} → ${GITHUB_REPOSITORY} (v${VERSION})"

      # Mirror artifacts to the public downloads-only repo — one rolling
      # release (tag `latest`, title v1.0.N) so /api/app/version and
      # /api/download/apk keep resolving `releases/latest` and storage stays
      # bounded (stale apk/aab assets are purged each run).
      # Requires secret DOWNLOADS_REPO_TOKEN (contents:write on Brave290/Turna-Downloads).
      # Assets: turna.apk / turna.aab / version.json
      - name: Check downloads token
        id: check-downloads
        env:
          DOWNLOADS_REPO_TOKEN: ${{ secrets.DOWNLOADS_REPO_TOKEN }}
        run: |
          if [ -n "$DOWNLOADS_REPO_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release to public downloads repo
        if: steps.check-downloads.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_REPO_TOKEN }}
          DOWNLOADS_REPO: ${{ vars.DOWNLOADS_REPO || 'Brave290/Turna-Downloads' }}
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          PRERELEASE: ${{ vars.RELEASE_PRERELEASE || 'false' }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then
            PRE_ARGS=(--prerelease=true --latest=false)
          else
            PRE_ARGS=(--prerelease=false --latest)
          fi
          cd release-artifacts
          APK_SHA=$(sha256sum turna.apk | awk '{print $1}')
          AAB_SHA=$(sha256sum turna.aab | awk '{print $1}')
          APK_SIZE=$(stat -c%s turna.apk)
          AAB_SIZE=$(stat -c%s turna.aab)
          NOTES=$(printf 'Turna v%s (build %s, code %s)\n\n- **turna.apk** — direct install · SHA256 `%s` · %s bytes\n- **turna.aab** — Play bundle · SHA256 `%s` · %s bytes\n- **version.json** — auto version manifest for in-app update checks' \
            "$VERSION" "${GITHUB_SHA::7}" "$VERSION_CODE" \
            "$APK_SHA" "$APK_SIZE" "$AAB_SHA" "$AAB_SIZE")
          cd ..

          RTAG="latest"
          gh release view "$RTAG" --repo "$DOWNLOADS_REPO" >/dev/null 2>&1 || {
            gh release create "$RTAG" \
              --repo "$DOWNLOADS_REPO" \
              --latest \
              --title "v${VERSION}" \
              --notes "$NOTES"
          }
          gh release view "$RTAG" --repo "$DOWNLOADS_REPO" --json assets --jq '.assets[].name' 2>/dev/null \
            | while read -r OLD; do
                case "$OLD" in
                  *.apk|*.aab|version.json)
                    gh release delete-asset "$RTAG" "$OLD" --repo "$DOWNLOADS_REPO" --yes ;;
                esac
              done
          gh release upload "$RTAG" \
            "release-artifacts/turna.apk" \
            "release-artifacts/turna.aab" \
            "release-artifacts/version.json" \
            --repo "$DOWNLOADS_REPO" --clobber
          # Immutable legacy copy — keeps the mirror's full former-release list.
          if ! gh release view "v${VERSION}" --repo "$DOWNLOADS_REPO" >/dev/null 2>&1; then
            gh release create "v${VERSION}" \
              --repo "$DOWNLOADS_REPO" \
              --title "v${VERSION}" \
              --notes "$NOTES" \
              --prerelease="$PRERELEASE" \
              "release-artifacts/turna.apk" \
              "release-artifacts/turna.aab" \
              "release-artifacts/version.json"
          fi
          gh release edit "$RTAG" \
            --repo "$DOWNLOADS_REPO" \
            --latest \
            --prerelease=false \
            --title "v${VERSION}" \
            --notes "$NOTES"
          echo "Published ${RTAG} → ${DOWNLOADS_REPO} (v${VERSION})"

      - name: Check Vercel token
        id: check-vercel
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        if: steps.check-vercel.outputs.available == 'true'
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # Every push first lands as a Pre-release, then this step promotes that
      # exact same build to a full (non-prerelease) Latest release once the
      # artifacts are verified and the app is live. Set the repo variable
      # RELEASE_PRERELEASE=true to pin builds as prereleases permanently.
      - name: Promote prerelease to full release
        if: ${{ always() && vars.RELEASE_PRERELEASE != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${TAG:-}" ]; then
            echo "No tag computed — skipping promotion"
            exit 0
          fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG not found — skipping promotion"
            exit 0
          fi
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease=false \
            --latest \
            --draft=false
          echo "Promoted ${TAG} to a full release"
