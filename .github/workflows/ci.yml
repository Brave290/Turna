name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Cancel superseded runs on rapid pushes — saves Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Dependency audit
        run: pnpm audit --audit-level=high || true

  build-mobile-android:
    name: Build Mobile (Android)
    runs-on: ubuntu-latest
    needs: [checks]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Auto version: short 1.0.N (next patch from releases/tags — "v1.0.1" style),
      # code = epoch minutes (always monotonic for Android upgrades).
      - name: Compute version (auto)
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MAX=0
          CANDS=$( { gh api "repos/${GITHUB_REPOSITORY}/releases" --jq '.[].name' 2>/dev/null || true; gh api "repos/${GITHUB_REPOSITORY}/tags" --jq '.[].name' 2>/dev/null || true; } )
          for CAND in $CANDS; do
            CAND="${CAND#Turna Android }"
            if printf '%s' "$CAND" | grep -Eq '^v?1\.0\.([0-9]+)$'; then
              N=$(printf '%s' "$CAND" | sed -E 's/^v?1\.0\.([0-9]+)$/\1/')
              if [ "$N" -gt "$MAX" ]; then MAX="$N"; fi
            fi
          done
          NEXT=$((MAX + 1))
          CODE=$(( $(date -u +%s) / 60 ))
          NAME="1.0.${NEXT}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          printf '{"versionCode": %s, "versionName": "%s", "minSupportedCode": 1, "apk": "turna.apk", "aab": "turna.aab", "notes": "Turna build %s", "builtAt": "%s"}' \
            "$CODE" "$NAME" "${GITHUB_SHA::7}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > version.json
          echo "Auto version ${NAME} (code ${CODE}, next patch after ${MAX})"

      # Decode release keystore from GitHub secret — never commit the binary
      - name: Restore Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          mkdir -p apps/mobile/android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/mobile/android/keystore/turna-release.keystore
          # Sanity: JKS magic FEEDFEFE or PKCS#12 DER SEQUENCE (30 82)
          MAGIC=$(head -c 2 apps/mobile/android/keystore/turna-release.keystore | od -An -tx1 | tr -d ' \n')
          case "$MAGIC" in
            feedfefe|3082) ;;
            *)
              echo "Decoded keystore has unexpected magic: $MAGIC" >&2
              exit 1
              ;;
          esac
          SIZE=$(stat -c%s apps/mobile/android/keystore/turna-release.keystore)
          if [ "$SIZE" -lt 100 ]; then
            echo "Decoded keystore too small ($SIZE bytes)" >&2
            exit 1
          fi
          echo "Keystore restored ($SIZE bytes, magic $MAGIC)"

      - name: Build Android Release AAB
        run: ./gradlew bundleRelease --no-daemon
        working-directory: apps/mobile/android
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ secrets.ANDROID_SIGNING_STORE_FILE }}

      - name: Build Android Release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: apps/mobile/android
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ secrets.ANDROID_SIGNING_STORE_FILE }}

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/**/*.aab
          retention-days: 14

      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/**/*.apk
          retention-days: 7

      # Rolling release with fixed short names, published to BOTH the main repo
      # (android-latest) and the public downloads repo (latest):
      #   turna.apk   turna.aab   version.json
      # Stale apk/aab assets are purged each run so storage stays bounded.
      - name: Publish versioned Android release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN_MAIN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN_DL: ${{ secrets.DOWNLOADS_REPO_TOKEN }}
          DOWNLOADS_REPO: ${{ vars.DOWNLOADS_REPO || 'Brave290/Turna-Downloads' }}
          VERSION: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          APK=$(find apps/mobile/android/app/build/outputs/apk/release -name '*.apk' 2>/dev/null | head -1)
          AAB=$(find apps/mobile/android/app/build/outputs/bundle/release -name '*.aab' 2>/dev/null | head -1)
          test -n "$APK"
          test -n "$AAB"
          cp "$APK" turna.apk
          cp "$AAB" turna.aab
          APK_SHA=$(sha256sum turna.apk | awk '{print $1}')
          AAB_SHA=$(sha256sum turna.aab | awk '{print $1}')
          APK_SIZE=$(stat -c%s turna.apk)
          AAB_SIZE=$(stat -c%s turna.aab)
          NOTES=$(printf 'Turna v%s (build %s, code %s)\n\n- **turna.apk** — direct install · SHA256 `%s` · %s bytes\n- **turna.aab** — Play bundle · SHA256 `%s` · %s bytes\n- **version.json** — auto version manifest for in-app update checks' \
            "$VERSION" "${GITHUB_SHA::7}" "$VERSION_CODE" \
            "$APK_SHA" "$APK_SIZE" "$AAB_SHA" "$AAB_SIZE")

          publish_release() {
            local TOKEN="$1" REPO="$2" RTAG="$3"
            if [ -z "$TOKEN" ]; then
              echo "No token for $REPO — skipping."
              return 0
            fi
            GH_TOKEN="$TOKEN" gh release view "$RTAG" --repo "$REPO" >/dev/null 2>&1 || {
              GH_TOKEN="$TOKEN" gh release create "$RTAG" \
                --repo "$REPO" \
                --latest \
                --title "v${VERSION}" \
                --notes "$NOTES"
            }
            GH_TOKEN="$TOKEN" gh release view "$RTAG" --repo "$REPO" --json assets --jq '.assets[].name' 2>/dev/null \
              | while read -r OLD; do
                  case "$OLD" in
                    *.apk|*.aab|version.json)
                      GH_TOKEN="$TOKEN" gh release delete-asset "$RTAG" "$OLD" --repo "$REPO" --yes ;;
                  esac
                done
            GH_TOKEN="$TOKEN" gh release upload "$RTAG" \
              turna.apk turna.aab version.json \
              --repo "$REPO" --clobber
            GH_TOKEN="$TOKEN" gh release edit "$RTAG" \
              --repo "$REPO" \
              --latest \
              --prerelease=false \
              --title "v${VERSION}" \
              --notes "$NOTES"
            echo "Published ${RTAG} → ${REPO} (v${VERSION})"
          }

          publish_release "$GH_TOKEN_MAIN" "$GITHUB_REPOSITORY" "android-latest"
          publish_release "$GH_TOKEN_DL" "$DOWNLOADS_REPO" "latest"
