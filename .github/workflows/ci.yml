name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level=high || true

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm build:web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/.next/
          retention-days: 7

  build-mobile-android:
    name: Build Mobile (Android)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Android Release AAB
        run: ./gradlew bundleRelease --no-daemon
        working-directory: apps/mobile/android

      - name: Build Android Release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: apps/mobile/android

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/**/*.aab
          retention-days: 14

      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/**/*.apk
          retention-days: 7

      # Direct .apk download (GitHub Actions artifacts always come as .zip)
      - name: Publish rolling APK release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=$(find apps/mobile/android/app/build/outputs/apk/release -name '*.apk' 2>/dev/null | head -1)
          test -n "$APK"
          cp "$APK" turna-latest.apk
          SHA=$(sha256sum turna-latest.apk | awk '{print $1}')
          SIZE=$(stat -c%s turna-latest.apk)
          NOTES="Latest release APK from \`${GITHUB_SHA::7}\` — direct install, no zip.\\n\\nSHA256: \`${SHA}\`\\nSize: $((SIZE / 1024 / 1024)) MB"
          gh release view android-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || {
            gh release create android-latest \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "Turna Android (latest)" \
              --notes "$NOTES"
          }
          gh release upload android-latest turna-latest.apk --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit android-latest --repo "$GITHUB_REPOSITORY" --prerelease --title "Turna Android (latest)" --notes "$NOTES"

  build-mobile-ios:
    name: Build Mobile (iOS)
    runs-on: macos-latest
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python (for xcodebuild plugins)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Xcode
        uses: maximilianharrer/install-xcode-action@v3
        with:
          xcode-version: '15.0'

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/mobile

      - name: Install CocoaPods (iOS)
        run: |
          cd apps/mobile
          pod install --fresh-start

      - name: Code Signing
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        run: |
          # Setup code signing - requires Apple Developer credentials
          # See: https://github.com/getixdx/react-native-xcode-credentials
          echo "Code signing setup needed - configure Apple Developer secrets"

      - name: Build iOS Release
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          cd apps/mobile
          xcodebuild -workspace apps/mobile/ios/Turna.xcworkspace \
            -scheme Turna \
            -configuration Release \
            -archivePath ios/build/Turna.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE="${{ secrets.PROVISIONING_PROFILE }}" \
            -quiet

      - name: Export IPA
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          cd apps/mobile
          xcodebuild -exportArchive \
            -archivePath ios/build/Turna.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -quiet

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: apps/mobile/ios/build/Release-iphoneos/Turna.app
          retention-days: 14

      - name: Publish iOS TestFlight
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # Publish to TestFlight via App Store API
          # Requires APPLE_API_KEY and APPLE_API_ISSUER secrets
          echo "TestFlight publishing - configure Apple API credentials"
