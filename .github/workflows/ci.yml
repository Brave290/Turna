name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level=high || true

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm build:web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/.next/
          retention-days: 7

  build-mobile-android:
    name: Build Mobile (Android)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Decode release keystore from GitHub secret — never commit the binary
      - name: Restore Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          mkdir -p apps/mobile/android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/mobile/android/keystore/turna-release.keystore
          # Sanity: JKS magic FEEDFEFE or PKCS#12 DER SEQUENCE (30 82)
          MAGIC=$(head -c 2 apps/mobile/android/keystore/turna-release.keystore | od -An -tx1 | tr -d ' \n')
          case "$MAGIC" in
            feedfefe|3082) ;;
            *)
              echo "Decoded keystore has unexpected magic: $MAGIC" >&2
              exit 1
              ;;
          esac
          SIZE=$(stat -c%s apps/mobile/android/keystore/turna-release.keystore)
          if [ "$SIZE" -lt 100 ]; then
            echo "Decoded keystore too small ($SIZE bytes)" >&2
            exit 1
          fi
          echo "Keystore restored ($SIZE bytes, magic $MAGIC)"

      - name: Build Android Release AAB
        run: ./gradlew bundleRelease --no-daemon
        working-directory: apps/mobile/android
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ secrets.ANDROID_SIGNING_STORE_FILE }}

      - name: Build Android Release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: apps/mobile/android
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ secrets.ANDROID_SIGNING_STORE_FILE }}

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/**/*.aab
          retention-days: 14

      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/**/*.apk
          retention-days: 7

      # Direct .apk download (GitHub Actions artifacts always come as .zip)
      - name: Publish rolling APK release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=$(find apps/mobile/android/app/build/outputs/apk/release -name '*.apk' 2>/dev/null | head -1)
          test -n "$APK"
          cp "$APK" turna-latest.apk
          SHA=$(sha256sum turna-latest.apk | awk '{print $1}')
          SIZE=$(stat -c%s turna-latest.apk)
          NOTES="Latest release APK from \`${GITHUB_SHA::7}\` — direct install, no zip.\\n\\nSHA256: \`${SHA}\`\\nSize: $((SIZE / 1024 / 1024)) MB"
          gh release view android-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || {
            gh release create android-latest \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "Turna Android (latest)" \
              --notes "$NOTES"
          }
          gh release upload android-latest turna-latest.apk --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit android-latest --repo "$GITHUB_REPOSITORY" --prerelease --title "Turna Android (latest)" --notes "$NOTES"

      # Mirror the rolling APK to the public downloads repo — stable unauthenticated URL:
      # https://github.com/Brave290/Turna-Downloads/releases/latest/download/turna.apk
      - name: Mirror APK to public downloads repo
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_REPO_TOKEN }}
          DOWNLOADS_REPO: ${{ vars.DOWNLOADS_REPO || 'Brave290/Turna-Downloads' }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "DOWNLOADS_REPO_TOKEN not set — skipping public mirror."
            exit 0
          fi
          APK=$(find apps/mobile/android/app/build/outputs/apk/release -name '*.apk' 2>/dev/null | head -1)
          test -n "$APK"
          cp "$APK" turna.apk
          FILES="turna.apk"
          AAB=$(find apps/mobile/android/app/build/outputs/bundle/release -name '*.aab' 2>/dev/null | head -1)
          if [ -n "$AAB" ]; then
            cp "$AAB" turna.aab
            FILES="turna.apk turna.aab"
          fi
          SHA=$(sha256sum turna.apk | awk '{print $1}')
          SIZE=$(stat -c%s turna.apk)
          NOTES="Latest Turna Android build from \`${GITHUB_SHA::7}\`.\\n\\nSHA256: \`${SHA}\`\\nSize: $((SIZE / 1024 / 1024)) MB"
          gh release view latest --repo "$DOWNLOADS_REPO" >/dev/null 2>&1 || {
            gh release create latest \
              --repo "$DOWNLOADS_REPO" \
              --title "Turna Android (latest)" \
              --notes "$NOTES"
          }
          # shellcheck disable=SC2086
          gh release upload latest $FILES --repo "$DOWNLOADS_REPO" --clobber
          gh release edit latest --repo "$DOWNLOADS_REPO" --latest --notes "$NOTES"
          echo "Mirrored to $DOWNLOADS_REPO release 'latest'"

  build-mobile-ios:
    name: Build Mobile (iOS)
    runs-on: macos-14
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          ls /Applications | grep -E '^Xcode' || true
          if [ -d /Applications/Xcode_15.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install CocoaPods
        run: |
          pod --version || sudo gem install cocoapods --no-document

      - name: Install Pods
        working-directory: apps/mobile/ios
        env:
          NO_FLIPPER: '1'
        run: pod install

      - name: Build iOS Release (no signing)
        working-directory: apps/mobile
        env:
          NO_FLIPPER: '1'
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Turna.xcworkspace \
            -scheme Turna \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -quiet

      - name: Upload iOS build output
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-build
          path: apps/mobile/ios/build/Build/Products/Release-iphoneos/
          retention-days: 7
        if: success()
