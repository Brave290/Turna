name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level=high || true

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm build:web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/.next/
          retention-days: 7

  build-mobile-android:
    name: Build Mobile (Android)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Auto version: 1.0.YYMMDD.HHMM, code = epoch minutes (monotonic, no manual edits)
      - name: Compute version (auto)
        id: version
        run: |
          set -euo pipefail
          STAMP=$(date -u +%y%m%d)
          CLOCK=$(date -u +%H%M)
          CODE=$(( $(date -u +%s) / 60 ))
          NAME="1.0.${STAMP}.${CLOCK}"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${CODE}" >> "$GITHUB_OUTPUT"
          printf '{"versionCode": %s, "versionName": "%s", "minSupportedCode": 1, "apk": "%s-turna.apk", "aab": "%s-turna.aab", "notes": "Turna build %s", "builtAt": "%s"}' \
            "$CODE" "$NAME" "$NAME" "$NAME" "${GITHUB_SHA::7}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > version.json
          echo "Auto version ${NAME} (code ${CODE})"

      # Decode release keystore from GitHub secret — never commit the binary
      - name: Restore Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          mkdir -p apps/mobile/android/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/mobile/android/keystore/turna-release.keystore
          # Sanity: JKS magic FEEDFEFE or PKCS#12 DER SEQUENCE (30 82)
          MAGIC=$(head -c 2 apps/mobile/android/keystore/turna-release.keystore | od -An -tx1 | tr -d ' \n')
          case "$MAGIC" in
            feedfefe|3082) ;;
            *)
              echo "Decoded keystore has unexpected magic: $MAGIC" >&2
              exit 1
              ;;
          esac
          SIZE=$(stat -c%s apps/mobile/android/keystore/turna-release.keystore)
          if [ "$SIZE" -lt 100 ]; then
            echo "Decoded keystore too small ($SIZE bytes)" >&2
            exit 1
          fi
          echo "Keystore restored ($SIZE bytes, magic $MAGIC)"

      - name: Build Android Release AAB
        run: ./gradlew bundleRelease --no-daemon
        working-directory: apps/mobile/android
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ secrets.ANDROID_SIGNING_STORE_FILE }}

      - name: Build Android Release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: apps/mobile/android
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          SIGNING_STORE_FILE: ${{ secrets.ANDROID_SIGNING_STORE_FILE }}

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: apps/mobile/android/app/build/outputs/bundle/release/**/*.aab
          retention-days: 14

      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/**/*.apk
          retention-days: 7

      # Visible rolling release with auto-versioned assets, published to BOTH the
      # main repo (android-latest) and the public downloads repo (latest):
      #   {VERSION}-turna.apk  {VERSION}-turna.aab  version.json
      # Stale apk/aab assets are purged each run so storage stays bounded.
      - name: Publish versioned Android release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN_MAIN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN_DL: ${{ secrets.DOWNLOADS_REPO_TOKEN }}
          DOWNLOADS_REPO: ${{ vars.DOWNLOADS_REPO || 'Brave290/Turna-Downloads' }}
          VERSION: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          APK=$(find apps/mobile/android/app/build/outputs/apk/release -name '*.apk' 2>/dev/null | head -1)
          AAB=$(find apps/mobile/android/app/build/outputs/bundle/release -name '*.aab' 2>/dev/null | head -1)
          test -n "$APK"
          test -n "$AAB"
          cp "$APK" "${VERSION}-turna.apk"
          cp "$AAB" "${VERSION}-turna.aab"
          APK_SHA=$(sha256sum "${VERSION}-turna.apk" | awk '{print $1}')
          AAB_SHA=$(sha256sum "${VERSION}-turna.aab" | awk '{print $1}')
          APK_SIZE=$(stat -c%s "${VERSION}-turna.apk")
          AAB_SIZE=$(stat -c%s "${VERSION}-turna.aab")
          NOTES=$(printf 'Turna Android %s (build %s, code %s)\n\n- **%s-turna.apk** — direct install · SHA256 `%s` · %s bytes\n- **%s-turna.aab** — Play bundle · SHA256 `%s` · %s bytes\n- **version.json** — auto version manifest for in-app update checks' \
            "$VERSION" "${GITHUB_SHA::7}" "$VERSION_CODE" \
            "$VERSION" "$APK_SHA" "$APK_SIZE" "$VERSION" "$AAB_SHA" "$AAB_SIZE")

          publish_release() {
            local TOKEN="$1" REPO="$2" RTAG="$3"
            if [ -z "$TOKEN" ]; then
              echo "No token for $REPO — skipping."
              return 0
            fi
            GH_TOKEN="$TOKEN" gh release view "$RTAG" --repo "$REPO" >/dev/null 2>&1 || {
              GH_TOKEN="$TOKEN" gh release create "$RTAG" \
                --repo "$REPO" \
                --latest \
                --title "Turna Android v${VERSION}" \
                --notes "$NOTES"
            }
            GH_TOKEN="$TOKEN" gh release view "$RTAG" --repo "$REPO" --json assets --jq '.assets[].name' 2>/dev/null \
              | while read -r OLD; do
                  case "$OLD" in
                    *.apk|*.aab|version.json)
                      GH_TOKEN="$TOKEN" gh release delete-asset "$RTAG" "$OLD" --repo "$REPO" --yes ;;
                  esac
                done
            GH_TOKEN="$TOKEN" gh release upload "$RTAG" \
              "${VERSION}-turna.apk" "${VERSION}-turna.aab" version.json \
              --repo "$REPO"
            GH_TOKEN="$TOKEN" gh release edit "$RTAG" \
              --repo "$REPO" \
              --latest \
              --prerelease=false \
              --title "Turna Android v${VERSION}" \
              --notes "$NOTES"
            echo "Published ${RTAG} → ${REPO} (v${VERSION})"
          }

          publish_release "$GH_TOKEN_MAIN" "$GITHUB_REPOSITORY" "android-latest"
          publish_release "$GH_TOKEN_DL" "$DOWNLOADS_REPO" "latest"

  build-mobile-ios:
    name: Build Mobile (iOS)
    runs-on: macos-14
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          ls /Applications | grep -E '^Xcode' || true
          if [ -d /Applications/Xcode_15.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install CocoaPods
        run: |
          pod --version || sudo gem install cocoapods --no-document

      - name: Install Pods
        working-directory: apps/mobile/ios
        env:
          NO_FLIPPER: '1'
        run: pod install

      - name: Build iOS Release (no signing)
        working-directory: apps/mobile
        env:
          NO_FLIPPER: '1'
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Turna.xcworkspace \
            -scheme Turna \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -quiet

      - name: Upload iOS build output
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-build
          path: apps/mobile/ios/build/Build/Products/Release-iphoneos/
          retention-days: 7
        if: success()
